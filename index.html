<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="container-fluid card">
        <nav class="container p-3">
            <ul class="nav justify-content-center">
                <li class="nav-item"><a href="#" class="nav-link">Pagina Inicial</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contacts</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Portifolio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container-fluid">
            <div class="container p-4">
                <div class="row">
                    <div class="col-8 card p-4">
                        <h3 class="h6 nav-title">Cadastro de Produto</h3>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Digite o nome do produto:</label>
                                <input type="text" class="form-control" id="valor1"">
                            </div>
                            <div class="col">
                                <label class="form-label">Digite o codigo do produto:</label>
                                <input type="text" class="form-control" id="valor2">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label for="" class="form-label">Digite a descrição do produto:</label>
                                <textarea class="form-control" rows="7"></textarea>
                            </div>
                            <div class="col d-flex flex-column justify-content-between">
                                <div>
                                    <label class="form-label">Preço do produto:</label>
                                    <input type="number" class="form-control">
                                </div>
                                <div>
                                    <button class="btn btn-success w-100" id="botao">Salvar</button>
                                </div>
                                <div>
                                    <button class="btn btn-danger w-100">Apagar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-4 d-flex flex-column justify-content-between">
                        <div class="card p-4">
                            <label class="form-label">Digite o Link:</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="card p-4">
                            <label class="form-label">Quantidade possivel de parcelas:</label>
                            <input type="number" max="12" min="1" class="form-control">
                        </div>
                        <div class="card p-4">
                            <label class="form-label">Digite o porcentagem de lucro:</label>
                            <input type="number" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="container-fluid">
            <div class="container px-5">
                <div class="row">
                    <div class="col p-4 card"></div>
                </div>

            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
        <script type="text/javascript">

        document.querySelector("#botao").addEventListener("click",function(){
            var valor1 = BigInt(document.querySelector("#valor1").value);
            var valor2 = BigInt(document.querySelector("#valor2").value);

            var resultado = valor1 + valor2

            console.log(resultado);
        })

    </script>

</body>
</html>
