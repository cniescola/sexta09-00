<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header class="container-fluid p-3 bg-info-subtle card">
        <nav class="container">
            <ul class="nav d-flex justify-content-center">
                <li class="nav-item"><a class="nav-link" href="#"> Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#"> Active</a></li>
                <li class="nav-item"><a class="nav-link" href="#"> About</a></li>
                <li class="nav-item"><a class="nav-link" href="#"> Services</a></li>
                <li class="nav-item "><a class="nav-link" href="#"> Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container-fluid">
            <div class="container p-4">
                <div class="row">
                    <div class="col-8 card">
                        <h3>Cadastro de produtos</h3>
                        <div class="row">
                            <div class="col">
                                <label class="form-label">Digite o nome do produto</label>
                                <input class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Digite o código do produto</label>
                                <input class="form-control">
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Digite a descrição do produto</label>
                                    <textarea class="form-control" rows="7"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="card p-4 mb-3">
                            <label class="form-label">Digite o Preço</label>
                            <input type="number" class="form-control">
                        </div>
                        <div class="card p-4 mb-3">
                            <label class="form-label">Numero de parcelas</label>
                            <input type="number" class="form-control" max="12">
                        </div>
                        <div class="card p-4">
                            <label class="form-label">Preço de entrega</label>
                            <input type="number" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
