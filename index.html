<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Bootstrap</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="calculator card shadow-lg p-3 bg-white">
    <!-- Display / Telinha de Resultado -->
    <div class="display d-flex align-items-center justify-content-end px-3 mb-3 text-end">
      0
    </div>

    <!-- Teclado de Botões -->
    <div class="row g-2">
      <!-- Linha 1: Limpar e Operações básicas -->
      <div class="col-6">
        <button class="btn btn-outline-danger w-100 btn-calc">C</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light text-primary fw-bold w-100 btn-calc">÷</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light text-primary fw-bold w-100 btn-calc">×</button>
      </div>

      <!-- Linha 2 -->
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">7</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">8</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">9</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light text-primary fw-bold w-100 btn-calc">−</button>
      </div>

      <!-- Linha 3 -->
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">4</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">5</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">6</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light text-primary fw-bold w-100 btn-calc">+</button>
      </div>

      <!-- Linha 4 -->
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">1</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">2</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">3</button>
      </div>
      <div class="col-3 rowspan-2">
        <button class="btn btn-primary w-100 btn-calc h-100">=</button>
      </div>

      <!-- Linha 5 -->
      <div class="col-6">
        <button class="btn btn-light w-100 btn-calc">0</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100 btn-calc">,</button>
      </div>
    </div>
  </div>

</body>
</html>
